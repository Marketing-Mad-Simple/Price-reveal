<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Spiral</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" aria-label="Interactive number spiral">
    <div class="spiral" id="spiral"></div>

    <section class="counter-wrap">
      <div class="eyebrow">KEEP CLICKING</div>
      <div class="counter" id="counter">32999</div>
      <div class="hint" id="hint">Click anywhere to continue</div>
    </section>

    <div class="progress" aria-hidden="true">
      <span id="progressBar"></span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
