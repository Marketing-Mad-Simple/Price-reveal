<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Spiral</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <div class="spiral" id="spiral"></div>
  <section class="counter-wrap" aria-label="Price per square yard">
    <div class="counter-line">
      <span class="currency">₹</span>
      <div class="counter" id="counter">34999</div>
      <span class="price-suffix">/- per sq yard</span>
    </div>
  </section>
  <audio id="bgMusic" loop preload="auto" aria-hidden="true">
    <source src="background.mp3" type="audio/mpeg">
  </audio>
</main>
<script src="script.js"></script>
</body>
</html>
