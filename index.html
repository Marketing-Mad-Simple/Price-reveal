<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Number Spiral</title>

  <link
    rel="stylesheet"
    href="styles.css"
  />
</head>


<body>

  <main
    id="app"
    aria-label="Interactive number spiral"
  >

    <!-- ======================================================
         BACKGROUND NUMBER SPIRAL
         ====================================================== -->

    <div
      class="spiral"
      id="spiral"
    ></div>


    <!-- ======================================================
         MAIN COUNTER
         ====================================================== -->

    <section class="counter-wrap">

      <div
        class="counter"
        id="counter"
      >
        34999
      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
